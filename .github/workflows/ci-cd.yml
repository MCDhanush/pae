name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true

      - name: Format Go source
        run: gofmt -w .

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

      - name: Build backend
        run: go build ./cmd/api

  deploy:
    name: Deploy
    needs:
      - frontend
      - backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
    steps:
      - name: Trigger Render deployment
        if: ${{ env.RENDER_DEPLOY_HOOK != '' }}
        run: curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK"

      - name: Trigger Netlify deployment
        if: ${{ env.NETLIFY_BUILD_HOOK != '' }}
        run: curl --fail --silent --show-error --request POST "$NETLIFY_BUILD_HOOK"

      - name: Report deployment configuration
        if: ${{ env.RENDER_DEPLOY_HOOK == '' && env.NETLIFY_BUILD_HOOK == '' }}
        run: echo "No deployment hooks configured; CI completed successfully."
